<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:"DejaVu Sans",Arial,sans-serif;overflow:hidden}
.bg{position:relative;width:1080px;height:1080px;
 background:radial-gradient(circle at 70% 55%,#a3462a 0%,#5e1d10 45%,#2a0c06 100%);color:#fff}
.top{position:absolute;top:56px;left:64px;right:64px}
.tag{display:inline-block;background:#e8b84a;color:#3a1206;font-weight:700;font-size:26px;
 padding:10px 22px;border-radius:40px;letter-spacing:1px}
h1{font-size:68px;line-height:1.05;margin-top:26px;font-weight:800}
h1 span{color:#f2c75c}
.sub{font-size:32px;margin-top:18px;color:#f7e3c4;line-height:1.35}
/* bottle */
.bottle{position:absolute;right:110px;top:370px;width:270px;height:430px}
.cap{position:absolute;left:55px;top:0;width:160px;height:70px;border-radius:14px;
 background:linear-gradient(90deg,#2b2b2b,#555,#2b2b2b)}
.neck{position:absolute;left:75px;top:62px;width:120px;height:30px;background:#c9a24a}
.body{position:absolute;left:0;top:88px;width:270px;height:342px;border-radius:40px;
 background:linear-gradient(90deg,#c7891f,#f3cd6a 45%,#b8761a)}
.label{position:absolute;left:20px;top:150px;width:230px;height:220px;border-radius:16px;
 background:#fff8ea;color:#5e1d10;text-align:center;padding-top:26px}
.label b{display:block;font-size:40px;font-weight:900;letter-spacing:1px}
.label i{display:block;font-style:normal;font-size:24px;font-weight:700;color:#a3462a;margin-top:4px}
.label small{display:block;font-size:17px;margin-top:16px;color:#7a4a30}
.mush{position:absolute;left:30px;top:150px;width:150px;height:110px;border-radius:50% 50% 45% 45%;
 background:radial-gradient(circle at 40% 35%,#d07a3a,#7a2c12 70%);box-shadow:0 0 0 10px #f2c75c33}
.mush:after{content:"";position:absolute;left:62px;top:96px;width:26px;height:70px;background:#d9b98a;border-radius:8px}
.list{position:absolute;left:64px;top:500px;font-size:34px;line-height:1.9}
.list div:before{content:"✔";color:#f2c75c;margin-right:14px;font-weight:900}
.price{position:absolute;left:64px;bottom:150px;background:#f2c75c;color:#3a1206;border-radius:24px;
 padding:18px 34px}
.price small{display:block;font-size:26px;font-weight:700}
.price b{font-size:84px;font-weight:900;line-height:1}
.cta{position:absolute;left:0;right:0;bottom:0;height:110px;background:#1b0703;
 display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#f2c75c;letter-spacing:1px}
.bpom{position:absolute;right:64px;bottom:160px;font-size:24px;color:#f7e3c4;text-align:right}
</style></head><body>
<div class="bg">
 <div class="top">
  <span class="tag">EKSTRAK JAMUR LINGZHI</span>
  <h1>Badan Gampang Capek<br>&amp; <span>Sering Drop?</span></h1>
  <p class="sub">Jaga stamina &amp; daya tahan tubuh<br>dengan Bio Lingzhi Pro</p>
 </div>
 <div class="list">
  <div>Kapsul 500 mg</div>
  <div>Bahan alami</div>
  <div>Terdaftar BPOM</div>
 </div>
 <div class="bottle">
  <div class="cap"></div><div class="neck"></div><div class="body"></div>
  <div class="label"><b>BIO</b><b>LINGZHI</b><i>PRO</i><small>Ganoderma lucidum<br>Kapsul 500 mg</small></div>
 </div>
 <div class="price"><small>HARGA SPESIAL</small><b>Rp499.000</b></div>
 <div class="bpom">BPOM TR213321651</div>
 <div class="cta">PESAN SEKARANG — KLIK TOMBOL DI BAWAH 👇</div>
</div>
</body></html>
